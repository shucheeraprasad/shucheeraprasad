<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
<defs>

  <linearGradient id="basebg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#05070f"/>
    <stop offset="100%" stop-color="#0a0118"/>
  </linearGradient>

  <radialGradient id="n1" cx="12%" cy="72%" r="50%"><stop offset="0%" stop-color="#7f1d1d" stop-opacity=".70"/><stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/></radialGradient>
  <radialGradient id="n2" cx="24%" cy="52%" r="45%"><stop offset="0%" stop-color="#be185d" stop-opacity=".55"/><stop offset="100%" stop-color="#be185d" stop-opacity="0"/></radialGradient>
  <radialGradient id="n3" cx="10%" cy="22%" r="42%"><stop offset="0%" stop-color="#f43f5e" stop-opacity=".45"/><stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
  <radialGradient id="n4" cx="42%" cy="48%" r="50%"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".40"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="n5" cx="58%" cy="40%" r="45%"><stop offset="0%" stop-color="#4338ca" stop-opacity=".35"/><stop offset="100%" stop-color="#4338ca" stop-opacity="0"/></radialGradient>
  <radialGradient id="n6" cx="88%" cy="38%" r="40%"><stop offset="0%" stop-color="#1d4ed8" stop-opacity=".30"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
  <radialGradient id="n7" cx="96%" cy="20%" r="35%"><stop offset="0%" stop-color="#0891b2" stop-opacity=".25"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <radialGradient id="n8" cx="8%"  cy="95%" r="40%"><stop offset="0%" stop-color="#c2410c" stop-opacity=".50"/><stop offset="100%" stop-color="#c2410c" stop-opacity="0"/></radialGradient>

  <linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#f472b6" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#f472b6" stop-opacity=".6"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="tg" x1="164" x2="736" y1="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="40%"  stop-color="#f9a8d4"/>
    <stop offset="70%"  stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>

  <linearGradient id="hullg" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%"   stop-color="#2e0060"/>
    <stop offset="100%" stop-color="#6d28d9"/>
  </linearGradient>

  <radialGradient id="engr" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="35%"  stop-color="#ec4899"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#67e8f9" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
  </linearGradient>

  <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sg" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tglow" x="-8%" y="-30%" width="116%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    @keyframes shipfly {
      0%   { transform: translate(520px,-165px) rotate(12deg); opacity:0; }
      6%   { opacity:1; }
      22%  { transform: translate(0px,0px) rotate(0deg); }
      57%  { transform: translate(0px,0px) rotate(0deg); }
      63%  { transform: translate(-10px,-18px) rotate(-6deg); }
      80%  { transform: translate(-570px,-175px) rotate(-14deg); opacity:1; }
      87%  { opacity:0; }
      100% { transform: translate(-570px,-175px); opacity:0; }
    }
    #ship { animation: shipfly 8s cubic-bezier(.25,.46,.45,.94) both; transform-box:fill-box; transform-origin:center; }

    @keyframes engpulse { 0%,100%{opacity:.9} 50%{opacity:1} }
    #eng { animation: engpulse .35s ease-in-out infinite; }

    @keyframes ex { 0%{transform:translate(0,0);opacity:.85} 100%{transform:translate(50px,0);opacity:0} }
    .ex  { animation: ex .5s ease-out infinite; transform-box:fill-box; transform-origin:center; }
    .ex2 { animation-delay:.17s; }
    .ex3 { animation-delay:.34s; }

    @keyframes beamon { 0%,23%{opacity:0} 26%{opacity:.75} 56%{opacity:.55} 63%{opacity:0} 100%{opacity:0} }
    .cb { animation: beamon 8s ease both; }

    @keyframes dropit {
      0%   { transform:translateY(-82px); opacity:0; }
      18%  { opacity:1; }
      72%  { transform:translateY(5px); }
      83%  { transform:translateY(-2px); }
      92%  { transform:translateY(1px); }
      100% { transform:translateY(0); opacity:1; }
    }
    .L {
      animation: dropit .7s ease-out both;
      font-family: Georgia,'Times New Roman',serif;
      font-size: 52px;
      font-weight: 700;
      fill: url(#tg);
      filter: url(#tglow);
      transform-box: fill-box;
      transform-origin: center;
    }
    .d00{animation-delay:1.80s} .d01{animation-delay:1.93s} .d02{animation-delay:2.06s}
    .d03{animation-delay:2.19s} .d04{animation-delay:2.32s} .d05{animation-delay:2.45s}
    .d06{animation-delay:2.58s} .d07{animation-delay:2.71s} .d08{animation-delay:2.84s}
    .d09{animation-delay:2.97s} .d10{animation-delay:3.10s} .d11{animation-delay:3.23s}
    .d12{animation-delay:3.36s} .d13{animation-delay:3.49s} .d14{animation-delay:3.62s}

    @keyframes tw1 { 0%,100%{opacity:.65} 50%{opacity:.20} }
    @keyframes tw2 { 0%,100%{opacity:.40} 50%{opacity:.80} }
    @keyframes tw3 { 0%,100%{opacity:.70} 50%{opacity:.25} }
    @keyframes dbp  { 0%,100%{opacity:.35} 50%{opacity:.55} }
    #db { animation: dbp 3s ease-in-out infinite; }
  </style>
</defs>

<rect width="900" height="320" fill="url(#basebg)"/>
<rect width="900" height="320" fill="url(#n1)"/>
<rect width="900" height="320" fill="url(#n2)"/>
<rect width="900" height="320" fill="url(#n3)"/>
<rect width="900" height="320" fill="url(#n4)"/>
<rect width="900" height="320" fill="url(#n5)"/>
<rect width="900" height="320" fill="url(#n6)"/>
<rect width="900" height="320" fill="url(#n7)"/>
<rect width="900" height="320" fill="url(#n8)"/>

<line id="db" x1="-20" y1="310" x2="520" y2="-30" stroke="url(#beamg)" stroke-width="12" filter="url(#bloom)"/>

<circle cx="45"  cy="18"  r="1.5" fill="#fff" opacity=".70" style="animation:tw1 3.2s ease-in-out infinite"/>
<circle cx="120" cy="8"   r="1.0" fill="#fff" opacity=".50"/>
<circle cx="180" cy="28"  r="0.8" fill="#f9a8d4" opacity=".60" style="animation:tw2 2.8s ease-in-out infinite"/>
<circle cx="250" cy="15"  r="1.2" fill="#fff" opacity=".40"/>
<circle cx="320" cy="5"   r="0.9" fill="#fff" opacity=".60" style="animation:tw3 4.1s ease-in-out infinite"/>
<circle cx="380" cy="22"  r="1.4" fill="#c4b5fd" opacity=".50"/>
<circle cx="440" cy="10"  r="0.8" fill="#fff" opacity=".70" style="animation:tw1 2.5s ease-in-out infinite"/>
<circle cx="500" cy="30"  r="1.1" fill="#fff" opacity=".40"/>
<circle cx="560" cy="12"  r="1.5" fill="#f9a8d4" opacity=".60" style="animation:tw2 3.7s ease-in-out infinite"/>
<circle cx="620" cy="25"  r="0.9" fill="#fff" opacity=".50"/>
<circle cx="680" cy="8"   r="1.2" fill="#fff" opacity=".70" style="animation:tw3 3.0s ease-in-out infinite"/>
<circle cx="740" cy="20"  r="0.8" fill="#c4b5fd" opacity=".50"/>
<circle cx="800" cy="15"  r="1.3" fill="#fff" opacity=".40" style="animation:tw1 4.5s ease-in-out infinite"/>
<circle cx="850" cy="30"  r="0.9" fill="#fff" opacity=".60"/>
<circle cx="880" cy="10"  r="1.1" fill="#f9a8d4" opacity=".50" style="animation:tw2 2.2s ease-in-out infinite"/>
<circle cx="70"  cy="260" r="1.0" fill="#fff" opacity=".40"/>
<circle cx="150" cy="280" r="0.7" fill="#c4b5fd" opacity=".50" style="animation:tw3 3.5s ease-in-out infinite"/>
<circle cx="300" cy="290" r="0.8" fill="#fff" opacity=".40" style="animation:tw1 2.8s ease-in-out infinite"/>
<circle cx="600" cy="270" r="1.1" fill="#f9a8d4" opacity=".40"/>
<circle cx="700" cy="285" r="0.9" fill="#fff" opacity=".50" style="animation:tw2 4.0s ease-in-out infinite"/>
<circle cx="840" cy="295" r="0.8" fill="#fff" opacity=".30"/>
<circle cx="160" cy="200" r="1.1" fill="#c4b5fd" opacity=".40" style="animation:tw1 3.8s ease-in-out infinite"/>
<circle cx="855" cy="200" r="1.0" fill="#f9a8d4" opacity=".40" style="animation:tw3 2.6s ease-in-out infinite"/>

<!-- cargo beam: ship at y=90, name at y=172, beam bridges the gap -->
<rect class="cb" x="443" y="108" width="14" height="72" rx="7"  fill="url(#cbg)" filter="url(#glow)"/>
<rect class="cb" x="436" y="108" width="28" height="72" rx="14" fill="url(#cbg)" opacity=".22" filter="url(#bloom)"/>

<!-- spaceship (CSS animates the outer #ship group; inner g places it at 450,90) -->
<g id="ship">
  <g transform="translate(450,90)">
    <path d="M 16,-12 L 13,-44 L -16,-12 Z" fill="#5b21b6" stroke="#8b5cf6" stroke-width=".8" opacity=".92"/>
    <line x1="13" y1="-12" x2="6" y2="-36" stroke="#7c3aed" stroke-width=".5" opacity=".5"/>
    <path d="M 16,12 L 13,44 L -16,12 Z"    fill="#5b21b6" stroke="#8b5cf6" stroke-width=".8" opacity=".92"/>
    <line x1="13" y1="12"  x2="6" y2="36"  stroke="#7c3aed" stroke-width=".5" opacity=".5"/>
    <rect x="42" y="-9"  width="15" height="18" rx="5" fill="#1e0040"/>
    <rect x="44" y="-7"  width="11" height="14" rx="3" fill="#4c1d95"/>
    <path d="M-52,0 C-46,-7 -28,-14 16,-12 C38,-12 52,-5 52,0 C52,5 38,12 16,12 C-28,14 -46,7 -52,0Z"
      fill="url(#hullg)" stroke="#7c3aed" stroke-width="1.2"/>
    <path d="M-46,0 C-42,-5 -24,-10 14,-8 C32,-8 44,-3 44,0" stroke="#a855f7" stroke-width=".9" fill="none" opacity=".5"/>
    <line x1="-20" y1="-9" x2="-20" y2="9"  stroke="#4c1d95" stroke-width=".6" opacity=".7"/>
    <line x1="0"   y1="-11" x2="0" y2="11"  stroke="#4c1d95" stroke-width=".6" opacity=".5"/>
    <line x1="24"  y1="-10" x2="24" y2="10" stroke="#4c1d95" stroke-width=".5" opacity=".4"/>
    <ellipse cx="-12" cy="-3" rx="17" ry="10" fill="#0e7490" opacity=".85"/>
    <ellipse cx="-12" cy="-3" rx="17" ry="10" fill="#67e8f9" opacity=".22"/>
    <ellipse cx="-12" cy="-3" rx="17" ry="10" fill="none" stroke="#67e8f9" stroke-width="1" opacity=".7"/>
    <path d="M-24,-8 C-20,-13 -10,-13 -5,-9" stroke="#a5f3fc" stroke-width="1.2" fill="none" opacity=".65"/>
    <circle cx="-8" cy="-4" r="2.5" fill="#e0f2fe" opacity=".55"/>
    <circle cx="-53" cy="0" r="2.5" fill="#f0abfc" opacity=".8" filter="url(#sg)"/>
    <ellipse id="eng" cx="62" cy="0" rx="13" ry="13" fill="url(#engr)" opacity=".92" filter="url(#glow)"/>
    <circle class="ex"     cx="62" cy="-4" r="3"   fill="#ec4899"/>
    <circle class="ex ex2" cx="62" cy="4"  r="2.2" fill="#f472b6"/>
    <circle class="ex ex3" cx="62" cy="0"  r="2.6" fill="#fda4af"/>
  </g>
</g>

<!-- name letters drop from ship (y=90) into final position (y=172) -->
<text class="L d00" x="164" y="172">S</text>
<text class="L d01" x="198" y="172">H</text>
<text class="L d02" x="240" y="172">U</text>
<text class="L d03" x="282" y="172">C</text>
<text class="L d04" x="316" y="172">H</text>
<text class="L d05" x="358" y="172">E</text>
<text class="L d06" x="392" y="172">E</text>
<text class="L d07" x="426" y="172">R</text>
<text class="L d08" x="460" y="172">A</text>
<text class="L d09" x="516" y="172">P</text>
<text class="L d10" x="550" y="172">R</text>
<text class="L d11" x="584" y="172">A</text>
<text class="L d12" x="622" y="172">S</text>
<text class="L d13" x="656" y="172">A</text>
<text class="L d14" x="694" y="172">D</text>

</svg>
