<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%"   stop-color="#3b0764"/>
    <stop offset="30%"  stop-color="#7c3aed"/>
    <stop offset="65%"  stop-color="#a21caf"/>
    <stop offset="100%" stop-color="#db2777"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .letter {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 50px;
      font-weight: 900;
      fill: white;
      filter: url(#softglow);
      transform-box: fill-box;
      transform-origin: center;
    }
    .sub {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      fill: #f9a8d4;
      font-style: italic;
    }

    /* ── ASTEROID ── */
    @keyframes rock {
      0%   { transform: translate(875px, 2px)   rotate(0deg);   opacity: 1; }
      36%  { transform: translate(452px, 90px)  rotate(200deg); opacity: 1; }
      42%  { transform: translate(430px, 106px) rotate(230deg); opacity: 0; }
      100% { transform: translate(430px, 106px) rotate(230deg); opacity: 0; }
    }
    .asteroid {
      animation: rock 8s cubic-bezier(0.3,0,0.9,1) infinite;
      animation-fill-mode: both;
    }

    /* ── IMPACT FLASH ── */
    @keyframes boom {
      0%,37% { r: 0;     opacity: 0;  }
      40%    { r: 85px;  opacity: 0.9;}
      52%    { r: 140px; opacity: 0;  }
      100%   { r: 0;     opacity: 0;  }
    }
    .flash { animation: boom 8s ease-out infinite; fill: #fde68a; }

    /* ── STARS ── */
    @keyframes twinkle { 0%,100%{opacity:.1} 50%{opacity:.95} }

    /* ── PER-LETTER SCATTER + REASSEMBLE ── */
    /* timing: still→scatter→invisible→reassemble→still */
    /*          0-36%  36-50%  50-65%   65-90%   90-100% */

    @keyframes lS1 {
      0%,36%   { transform:translate(0,0)     rotate(0deg);    opacity:1 }
      50%      { transform:translate(-180px,-75px)  rotate(-155deg); opacity:0 }
      65%      { transform:translate(-180px,-75px)  rotate(-155deg); opacity:0 }
      88%      { transform:translate(-4px,-2px)     rotate(-3deg);   opacity:1 }
      95%,100% { transform:translate(0,0)     rotate(0deg);    opacity:1 }
    }
    @keyframes lH1 {
      0%,36%   { transform:translate(0,0)    rotate(0deg);   opacity:1 }
      50%      { transform:translate(-85px,-135px) rotate(125deg);  opacity:0 }
      65%      { transform:translate(-85px,-135px) rotate(125deg);  opacity:0 }
      88%      { transform:translate(-2px,4px)     rotate(3deg);    opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);   opacity:1 }
    }
    @keyframes lU {
      0%,36%   { transform:translate(0,0)   rotate(0deg);   opacity:1 }
      50%      { transform:translate(12px,-165px) rotate(-95deg);  opacity:0 }
      65%      { transform:translate(12px,-165px) rotate(-95deg);  opacity:0 }
      88%      { transform:translate(3px,-5px)    rotate(-2deg);   opacity:1 }
      95%,100% { transform:translate(0,0)   rotate(0deg);   opacity:1 }
    }
    @keyframes lC {
      0%,36%   { transform:translate(0,0)   rotate(0deg);   opacity:1 }
      50%      { transform:translate(95px,-105px) rotate(205deg);  opacity:0 }
      65%      { transform:translate(95px,-105px) rotate(205deg);  opacity:0 }
      88%      { transform:translate(4px,-2px)    rotate(4deg);    opacity:1 }
      95%,100% { transform:translate(0,0)   rotate(0deg);   opacity:1 }
    }
    @keyframes lH2 {
      0%,36%   { transform:translate(0,0)    rotate(0deg);    opacity:1 }
      50%      { transform:translate(-55px,135px)  rotate(-175deg); opacity:0 }
      65%      { transform:translate(-55px,135px)  rotate(-175deg); opacity:0 }
      88%      { transform:translate(-3px,5px)     rotate(-3deg);   opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);    opacity:1 }
    }
    @keyframes lE1 {
      0%,36%   { transform:translate(0,0)    rotate(0deg);  opacity:1 }
      50%      { transform:translate(155px,95px)   rotate(115deg); opacity:0 }
      65%      { transform:translate(155px,95px)   rotate(115deg); opacity:0 }
      88%      { transform:translate(5px,3px)      rotate(2deg);   opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);  opacity:1 }
    }
    @keyframes lE2 {
      0%,36%   { transform:translate(0,0)     rotate(0deg);    opacity:1 }
      50%      { transform:translate(-125px,82px)  rotate(-135deg); opacity:0 }
      65%      { transform:translate(-125px,82px)  rotate(-135deg); opacity:0 }
      88%      { transform:translate(-4px,2px)     rotate(-2deg);   opacity:1 }
      95%,100% { transform:translate(0,0)     rotate(0deg);    opacity:1 }
    }
    @keyframes lR1 {
      0%,36%   { transform:translate(0,0)   rotate(0deg);   opacity:1 }
      50%      { transform:translate(65px,-145px) rotate(165deg);  opacity:0 }
      65%      { transform:translate(65px,-145px) rotate(165deg);  opacity:0 }
      88%      { transform:translate(2px,-4px)    rotate(3deg);    opacity:1 }
      95%,100% { transform:translate(0,0)   rotate(0deg);   opacity:1 }
    }
    @keyframes lA1 {
      0%,36%   { transform:translate(0,0)     rotate(0deg);    opacity:1 }
      50%      { transform:translate(-95px,-115px) rotate(-205deg); opacity:0 }
      65%      { transform:translate(-95px,-115px) rotate(-205deg); opacity:0 }
      88%      { transform:translate(-3px,-4px)    rotate(-4deg);   opacity:1 }
      95%,100% { transform:translate(0,0)     rotate(0deg);    opacity:1 }
    }
    @keyframes lP {
      0%,36%   { transform:translate(0,0)    rotate(0deg);   opacity:1 }
      50%      { transform:translate(145px,75px)   rotate(135deg);  opacity:0 }
      65%      { transform:translate(145px,75px)   rotate(135deg);  opacity:0 }
      88%      { transform:translate(5px,2px)      rotate(3deg);    opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);   opacity:1 }
    }
    @keyframes lR2 {
      0%,36%   { transform:translate(0,0)     rotate(0deg);    opacity:1 }
      50%      { transform:translate(-165px,-65px) rotate(-145deg); opacity:0 }
      65%      { transform:translate(-165px,-65px) rotate(-145deg); opacity:0 }
      88%      { transform:translate(-4px,-2px)    rotate(-3deg);   opacity:1 }
      95%,100% { transform:translate(0,0)     rotate(0deg);    opacity:1 }
    }
    @keyframes lA2 {
      0%,36%   { transform:translate(0,0)   rotate(0deg);   opacity:1 }
      50%      { transform:translate(55px,155px)  rotate(195deg);  opacity:0 }
      65%      { transform:translate(55px,155px)  rotate(195deg);  opacity:0 }
      88%      { transform:translate(2px,5px)     rotate(4deg);    opacity:1 }
      95%,100% { transform:translate(0,0)   rotate(0deg);   opacity:1 }
    }
    @keyframes lS2 {
      0%,36%   { transform:translate(0,0)    rotate(0deg);    opacity:1 }
      50%      { transform:translate(-75px,115px)  rotate(-115deg); opacity:0 }
      65%      { transform:translate(-75px,115px)  rotate(-115deg); opacity:0 }
      88%      { transform:translate(-2px,4px)     rotate(-2deg);   opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);    opacity:1 }
    }
    @keyframes lA3 {
      0%,36%   { transform:translate(0,0)    rotate(0deg);   opacity:1 }
      50%      { transform:translate(135px,-85px)  rotate(165deg);  opacity:0 }
      65%      { transform:translate(135px,-85px)  rotate(165deg);  opacity:0 }
      88%      { transform:translate(4px,-3px)     rotate(3deg);    opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);   opacity:1 }
    }
    @keyframes lD {
      0%,36%   { transform:translate(0,0)    rotate(0deg);    opacity:1 }
      50%      { transform:translate(-45px,-155px) rotate(-185deg); opacity:0 }
      65%      { transform:translate(-45px,-155px) rotate(-185deg); opacity:0 }
      88%      { transform:translate(-2px,-5px)    rotate(-4deg);   opacity:1 }
      95%,100% { transform:translate(0,0)    rotate(0deg);    opacity:1 }
    }
  </style>
</defs>

<!-- Background -->
<rect width="900" height="200" fill="url(#bg)"/>

<!-- Stars -->
<circle cx="28"  cy="18"  r="1.5" fill="white" style="animation:twinkle 2.1s ease infinite"/>
<circle cx="75"  cy="42"  r="1"   fill="white" style="animation:twinkle 1.7s .3s ease infinite"/>
<circle cx="145" cy="12"  r="2"   fill="white" style="animation:twinkle 2.5s .8s ease infinite"/>
<circle cx="195" cy="52"  r="1"   fill="white" style="animation:twinkle 1.9s .5s ease infinite"/>
<circle cx="275" cy="22"  r="1.5" fill="white" style="animation:twinkle 2.3s 1.1s ease infinite"/>
<circle cx="345" cy="8"   r="1"   fill="white" style="animation:twinkle 1.6s .2s ease infinite"/>
<circle cx="415" cy="38"  r="2"   fill="white" style="animation:twinkle 2.7s .9s ease infinite"/>
<circle cx="488" cy="15"  r="1"   fill="white" style="animation:twinkle 2.0s .6s ease infinite"/>
<circle cx="555" cy="32"  r="1.5" fill="white" style="animation:twinkle 2.4s 1.3s ease infinite"/>
<circle cx="625" cy="10"  r="1"   fill="white" style="animation:twinkle 1.8s .4s ease infinite"/>
<circle cx="695" cy="45"  r="2"   fill="white" style="animation:twinkle 2.2s .7s ease infinite"/>
<circle cx="765" cy="20"  r="1"   fill="white" style="animation:twinkle 2.6s 1.0s ease infinite"/>
<circle cx="838" cy="35"  r="1.5" fill="white" style="animation:twinkle 1.5s .1s ease infinite"/>
<circle cx="878" cy="12"  r="1"   fill="white" style="animation:twinkle 2.8s 1.2s ease infinite"/>
<circle cx="48"  cy="172" r="1.5" fill="white" style="animation:twinkle 2.0s .4s ease infinite"/>
<circle cx="118" cy="183" r="1"   fill="white" style="animation:twinkle 1.9s .9s ease infinite"/>
<circle cx="748" cy="173" r="1.5" fill="white" style="animation:twinkle 2.3s .6s ease infinite"/>
<circle cx="818" cy="162" r="1"   fill="white" style="animation:twinkle 1.7s 1.1s ease infinite"/>
<circle cx="865" cy="180" r="2"   fill="white" style="animation:twinkle 2.5s .3s ease infinite"/>
<circle cx="320" cy="185" r="1"   fill="white" style="animation:twinkle 2.1s .7s ease infinite"/>
<circle cx="500" cy="178" r="1.5" fill="white" style="animation:twinkle 1.6s 1.4s ease infinite"/>

<!-- Asteroid (starts top-right, CSS moves it) -->
<g class="asteroid">
  <!-- tail trails -->
  <line x1="-5" y1="-2"  x2="50"  y2="-30" stroke="#fde68a" stroke-width="3"   opacity="0.9" stroke-linecap="round"/>
  <line x1="-3" y1="3"   x2="60"  y2="-18" stroke="#f97316" stroke-width="2"   opacity="0.6" stroke-linecap="round"/>
  <line x1="1"  y1="7"   x2="42"  y2="-6"  stroke="#fb923c" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <!-- rock body -->
  <polygon points="0,0 15,-12 28,-6 30,9 20,18 7,16 -5,8" fill="#92400e" filter="url(#glow)"/>
  <polygon points="5,1 15,-9 24,-4 22,7 13,13 5,11"        fill="#b45309" opacity="0.75"/>
  <circle  cx="12" cy="2" r="3.5" fill="#78350f"/>
  <circle  cx="20" cy="8" r="2"   fill="#6b2d0c" opacity="0.7"/>
</g>

<!-- Impact flash -->
<circle class="flash" cx="452" cy="105"/>

<!-- ── NAME LETTERS  "SHUCHEERA PRASAD" ──
     Centered on 900px canvas, y-baseline=118
     Approximate x positions for Arial Black 50px:
     S=164  H=197  U=237  C=277  H=313  E=353  E=381  R=409  A=445
     P=510  R=546  A=582  S=618  A=652  D=686
-->
<text class="letter" x="164" y="118" style="animation:lS1 8s ease infinite; animation-fill-mode:both">S</text>
<text class="letter" x="197" y="118" style="animation:lH1 8s ease infinite; animation-fill-mode:both">H</text>
<text class="letter" x="237" y="118" style="animation:lU  8s ease infinite; animation-fill-mode:both">U</text>
<text class="letter" x="277" y="118" style="animation:lC  8s ease infinite; animation-fill-mode:both">C</text>
<text class="letter" x="313" y="118" style="animation:lH2 8s ease infinite; animation-fill-mode:both">H</text>
<text class="letter" x="353" y="118" style="animation:lE1 8s ease infinite; animation-fill-mode:both">E</text>
<text class="letter" x="381" y="118" style="animation:lE2 8s ease infinite; animation-fill-mode:both">E</text>
<text class="letter" x="409" y="118" style="animation:lR1 8s ease infinite; animation-fill-mode:both">R</text>
<text class="letter" x="445" y="118" style="animation:lA1 8s ease infinite; animation-fill-mode:both">A</text>
<text class="letter" x="510" y="118" style="animation:lP  8s ease infinite; animation-fill-mode:both">P</text>
<text class="letter" x="546" y="118" style="animation:lR2 8s ease infinite; animation-fill-mode:both">R</text>
<text class="letter" x="582" y="118" style="animation:lA2 8s ease infinite; animation-fill-mode:both">A</text>
<text class="letter" x="618" y="118" style="animation:lS2 8s ease infinite; animation-fill-mode:both">S</text>
<text class="letter" x="652" y="118" style="animation:lA3 8s ease infinite; animation-fill-mode:both">A</text>
<text class="letter" x="686" y="118" style="animation:lD  8s ease infinite; animation-fill-mode:both">D</text>

<!-- Subtitle -->
<text class="sub" x="450" y="162" text-anchor="middle">Astronomer · Developer · Child of the Cosmos</text>

</svg>
