<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" xml:space="preserve">
<defs>
  <clipPath id="card"><rect width="900" height="510" rx="16"/></clipPath>
  <linearGradient id="lbg" x1="0" y1="0" x2="330" y2="510" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#130020"/>
    <stop offset="100%" stop-color="#0c0018"/>
  </linearGradient>
  <linearGradient id="rbg" x1="330" y1="0" x2="900" y2="510" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#08000f"/>
    <stop offset="100%" stop-color="#05070f"/>
  </linearGradient>
  <linearGradient id="topbar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#1c0035"/>
    <stop offset="100%" stop-color="#130022"/>
  </linearGradient>
  <linearGradient id="headgrad" x1="24" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="50%"  stop-color="#e9d5ff"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="accentbar" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#a855f7"/>
    <stop offset="50%"  stop-color="#ec4899"/>
    <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="topline" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="30%"  stop-color="#a855f7"/>
    <stop offset="50%"  stop-color="#ec4899"/>
    <stop offset="70%"  stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowleft" cx="10%" cy="45%" r="55%" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <filter id="softglow">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family:'Fira Code','Cascadia Code','JetBrains Mono','SF Mono',Consolas,monospace; font-size:12.5px; }
    .ln   { font-family:'Fira Code','Cascadia Code','JetBrains Mono','SF Mono',Consolas,monospace; font-size:11px; fill:#3d3556; }
    .sans { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif; }
    @keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .cursor { animation:blink 1.2s step-end infinite; }
    .row    { animation:fadein 0.4s ease both; }
    .r1{animation-delay:.06s}.r2{animation-delay:.12s}.r3{animation-delay:.18s}
    .r4{animation-delay:.24s}.r5{animation-delay:.30s}.r6{animation-delay:.36s}
    .r7{animation-delay:.42s}.r8{animation-delay:.48s}.r9{animation-delay:.54s}
    .r10{animation-delay:.60s}.r11{animation-delay:.66s}.r12{animation-delay:.72s}
    .r13{animation-delay:.78s}.r14{animation-delay:.84s}.r15{animation-delay:.90s}
    .r16{animation-delay:.96s}.r17{animation-delay:1.04s}.r18{animation-delay:1.12s}
    .r19{animation-delay:1.18s}
  </style>
</defs>

<g clip-path="url(#card)">

  <!-- Panel backgrounds -->
  <rect x="0"   y="0" width="330" height="510" fill="url(#lbg)"/>
  <rect x="330" y="0" width="570" height="510" fill="url(#rbg)"/>

  <!-- Left nebula glow -->
  <rect x="0" y="0" width="330" height="510" fill="url(#glowleft)"/>

  <!-- Stars on right panel -->
  <circle cx="460" cy="85"  r="1.0" fill="#fff" opacity="0.50"/>
  <circle cx="530" cy="58"  r="0.7" fill="#fff" opacity="0.40"/>
  <circle cx="610" cy="125" r="1.2" fill="#fff" opacity="0.42"/>
  <circle cx="668" cy="78"  r="0.8" fill="#fff" opacity="0.58"/>
  <circle cx="730" cy="155" r="0.9" fill="#fff" opacity="0.35"/>
  <circle cx="808" cy="92"  r="1.0" fill="#fff" opacity="0.50"/>
  <circle cx="858" cy="195" r="1.2" fill="#c084fc" opacity="0.42"/>
  <circle cx="875" cy="52"  r="0.7" fill="#fff" opacity="0.48"/>
  <circle cx="770" cy="238" r="0.8" fill="#f472b6" opacity="0.38"/>
  <circle cx="888" cy="305" r="0.9" fill="#fff" opacity="0.30"/>
  <circle cx="495" cy="198" r="0.7" fill="#fff" opacity="0.28"/>
  <circle cx="845" cy="380" r="1.1" fill="#a855f7" opacity="0.35"/>
  <circle cx="590" cy="310" r="0.7" fill="#fff" opacity="0.22"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="900" height="42" fill="url(#topbar)"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#2e0050" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="22" cy="21" r="6" fill="#ec4899" opacity="0.85"/>
  <circle cx="42" cy="21" r="6" fill="#a855f7" opacity="0.85"/>
  <circle cx="62" cy="21" r="6" fill="#7c3aed" opacity="0.85"/>

  <!-- Header labels -->
  <text x="88"  y="26" class="sans" font-size="12" fill="#6b21a8">shucheeraprasad</text>
  <text x="230" y="26" class="sans" font-size="12" fill="#44006b"> / </text>
  <text x="250" y="26" class="sans" font-size="12" fill="#a855f7">README.md</text>
  <text x="688" y="26" class="sans" font-size="12" fill="#44006b">astronomer.py</text>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="2.5" fill="url(#topline)"/>

  <!-- Vertical divider -->
  <line x1="330" y1="42" x2="330" y2="510" stroke="#2e0050" stroke-width="1" opacity="0.9"/>

  <!-- ─── LEFT PANEL ─── -->

  <!-- Accent side bar -->
  <rect x="14" y="58" width="3" height="430" rx="1.5" fill="url(#accentbar)"/>

  <!-- Heading -->
  <text x="28" y="100" class="sans" font-size="30" font-weight="700" fill="url(#headgrad)" filter="url(#softglow)">Signal Received.</text>

  <!-- Subtitle -->
  <text x="28" y="118" class="sans" font-size="9.5" fill="#7c3aed" letter-spacing="1.5">🔭  FOREST ASTRONOMER  ·  MESSIER HUNTER</text>

  <!-- Divider -->
  <line x1="28" y1="130" x2="308" y2="130" stroke="#3b0764" stroke-width="1" opacity="0.7"/>

  <!-- Bio -->
  <text x="28" y="150" class="sans" font-size="12.5" fill="#c084fc">I'm <tspan fill="#fff" font-weight="600">Shucheera Prasad</tspan> — living</text>
  <text x="28" y="168" class="sans" font-size="12.5" fill="#c084fc">somewhere between the pine trees</text>
  <text x="28" y="186" class="sans" font-size="12.5" fill="#c084fc">and the Pleiades.</text>

  <text x="28" y="210" class="sans" font-size="12.5" fill="#c084fc">By day I write code; by night I</text>
  <text x="28" y="228" class="sans" font-size="12.5" fill="#c084fc">point a telescope at things older</text>
  <text x="28" y="246" class="sans" font-size="12.5" fill="#c084fc">than the Sun.</text>

  <!-- Divider -->
  <line x1="28" y1="260" x2="308" y2="260" stroke="#3b0764" stroke-width="1" opacity="0.4"/>

  <!-- Pills -->
  <rect x="28" y="270" width="284" height="26" rx="13" fill="#160028" stroke="#6d28d9" stroke-width="1"/>
  <text x="44" y="287" class="sans" font-size="12" fill="#c084fc">🌌  Building a Wide-Field Imager</text>

  <rect x="28" y="306" width="224" height="26" rx="13" fill="#160028" stroke="#6d28d9" stroke-width="1"/>
  <text x="44" y="323" class="sans" font-size="12" fill="#c084fc">🎯  Full Messier Catalogue</text>

  <rect x="28" y="342" width="236" height="26" rx="13" fill="#160028" stroke="#6d28d9" stroke-width="1"/>
  <text x="44" y="359" class="sans" font-size="12" fill="#c084fc">🌲  Forest → Telescope → Code</text>

  <!-- Info lines -->
  <line x1="28" y1="384" x2="308" y2="384" stroke="#3b0764" stroke-width="1" opacity="0.4"/>
  <text x="28" y="403" class="sans" font-size="11" fill="#581c87">📍 Planet Earth  ·  🌌 Mind in Andromeda</text>
  <text x="28" y="420" class="sans" font-size="11" fill="#581c87">🏔️ Mountain dark-sky sites preferred</text>
  <text x="28" y="437" class="sans" font-size="11" fill="#581c87">🔭 Photographing the cosmos, one frame at a time</text>

  <!-- Constellation dots at bottom -->
  <circle cx="40"  cy="465" r="2"   fill="#a855f7" opacity="0.70"/>
  <circle cx="82"  cy="477" r="1.5" fill="#ec4899" opacity="0.60"/>
  <circle cx="124" cy="461" r="2.5" fill="#a855f7" opacity="0.50"/>
  <circle cx="166" cy="473" r="1.5" fill="#c084fc" opacity="0.70"/>
  <circle cx="208" cy="459" r="2"   fill="#ec4899" opacity="0.60"/>
  <circle cx="250" cy="471" r="1.5" fill="#a855f7" opacity="0.50"/>
  <circle cx="292" cy="463" r="2"   fill="#c084fc" opacity="0.60"/>
  <line x1="40"  y1="465" x2="82"  y2="477" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
  <line x1="82"  y1="477" x2="124" y2="461" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
  <line x1="124" y1="461" x2="166" y2="473" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
  <line x1="166" y1="473" x2="208" y2="459" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
  <line x1="208" y1="459" x2="250" y2="471" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>
  <line x1="250" y1="471" x2="292" y2="463" stroke="#4c1d95" stroke-width="0.8" opacity="0.5"/>

  <!-- ─── RIGHT PANEL ─── -->

  <!-- Line-number gutter -->
  <rect x="330" y="42" width="44" height="468" fill="#040009" opacity="0.6"/>
  <line x1="374" y1="42" x2="374" y2="510" stroke="#2e0050" stroke-width="1" opacity="0.4"/>

  <!-- Line numbers -->
  <text x="368" y="75"  class="ln" text-anchor="end">1</text>
  <text x="368" y="95"  class="ln" text-anchor="end">2</text>
  <text x="368" y="115" class="ln" text-anchor="end">3</text>
  <text x="368" y="135" class="ln" text-anchor="end">4</text>
  <text x="368" y="155" class="ln" text-anchor="end">5</text>
  <text x="368" y="175" class="ln" text-anchor="end">6</text>
  <text x="368" y="195" class="ln" text-anchor="end">7</text>
  <text x="368" y="215" class="ln" text-anchor="end">8</text>
  <text x="368" y="235" class="ln" text-anchor="end">9</text>
  <text x="368" y="255" class="ln" text-anchor="end">10</text>
  <text x="368" y="275" class="ln" text-anchor="end">11</text>
  <text x="368" y="295" class="ln" text-anchor="end">12</text>
  <text x="368" y="315" class="ln" text-anchor="end">13</text>
  <text x="368" y="335" class="ln" text-anchor="end">14</text>
  <text x="368" y="355" class="ln" text-anchor="end">15</text>
  <text x="368" y="375" class="ln" text-anchor="end">16</text>
  <text x="368" y="415" class="ln" text-anchor="end">17</text>
  <text x="368" y="435" class="ln" text-anchor="end">18</text>
  <text x="368" y="475" class="ln" text-anchor="end">19</text>

  <!-- Code lines (x = 384) -->
  <text x="384" y="75"  class="mono row r1"><tspan fill="#c084fc">class </tspan><tspan fill="#67e8f9">ShucheeraPrasad</tspan><tspan fill="#9ca3af">:</tspan></text>
  <text x="384" y="95"  class="mono row r2"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">archetype</tspan><tspan fill="#9ca3af">   = </tspan><tspan fill="#f472b6">"Forest Astronomer  🔭🌿"</tspan></text>
  <text x="384" y="115" class="mono row r3"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">coordinates</tspan><tspan fill="#9ca3af"> = {</tspan></text>
  <text x="384" y="135" class="mono row r4"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"soul"</tspan><tspan fill="#9ca3af"> : </tspan><tspan fill="#f472b6">"Between the pines &amp; the Pleiades"</tspan><tspan fill="#9ca3af">,</tspan></text>
  <text x="384" y="155" class="mono row r5"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"body"</tspan><tspan fill="#9ca3af"> : </tspan><tspan fill="#f472b6">"Planet Earth  🌍"</tspan><tspan fill="#9ca3af">,</tspan></text>
  <text x="384" y="175" class="mono row r6"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"mind"</tspan><tspan fill="#9ca3af"> : </tspan><tspan fill="#f472b6">"Somewhere in the Andromeda Galaxy"</tspan></text>
  <text x="384" y="195" class="mono row r7"><tspan fill="#9ca3af">    }</tspan></text>
  <text x="384" y="215" class="mono row r8"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">elements</tspan><tspan fill="#9ca3af"> = {</tspan></text>
  <text x="384" y="235" class="mono row r9"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"🌿 Flora"</tspan><tspan fill="#9ca3af">  : </tspan><tspan fill="#f472b6">"Grounded · patient · ever-growing"</tspan><tspan fill="#9ca3af">,</tspan></text>
  <text x="384" y="255" class="mono row r10"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"🌊 Water"</tspan><tspan fill="#9ca3af">  : </tspan><tspan fill="#f472b6">"Fluid · reflective · deep"</tspan><tspan fill="#9ca3af">,</tspan></text>
  <text x="384" y="275" class="mono row r11"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"🔥 Fire"</tspan><tspan fill="#9ca3af">   : </tspan><tspan fill="#f472b6">"Stellar fusion &amp; CPU cores"</tspan><tspan fill="#9ca3af">,</tspan></text>
  <text x="384" y="295" class="mono row r12"><tspan fill="#9ca3af">        </tspan><tspan fill="#93c5fd">"🌌 Ether"</tspan><tspan fill="#9ca3af">  : </tspan><tspan fill="#f472b6">"The void between galaxies"</tspan></text>
  <text x="384" y="315" class="mono row r13"><tspan fill="#9ca3af">    }</tspan></text>
  <text x="384" y="335" class="mono row r14"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">mission</tspan><tspan fill="#9ca3af">    = </tspan><tspan fill="#f472b6">"📡 Wide-Field Astronomical Imager"</tspan></text>
  <text x="384" y="355" class="mono row r15"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">north_star</tspan><tspan fill="#9ca3af"> = </tspan><tspan fill="#f472b6">"Photograph the entire Messier catalogue"</tspan></text>
  <text x="384" y="375" class="mono row r16"><tspan fill="#9ca3af">    </tspan><tspan fill="#e879f9">ritual</tspan><tspan fill="#9ca3af">     = </tspan><tspan fill="#f472b6">"Forest walk → telescope → code → repeat"</tspan></text>
  <text x="384" y="415" class="mono row r17"><tspan fill="#9ca3af">    </tspan><tspan fill="#c084fc">def </tspan><tspan fill="#4ade80">transmit</tspan><tspan fill="#9ca3af">(</tspan><tspan fill="#67e8f9">self</tspan><tspan fill="#9ca3af">):</tspan></text>
  <text x="384" y="435" class="mono row r18"><tspan fill="#9ca3af">        </tspan><tspan fill="#4ade80">print</tspan><tspan fill="#9ca3af">(</tspan><tspan fill="#f472b6">"Signal locked. Welcome to the Observatory."</tspan><tspan fill="#9ca3af">)</tspan></text>
  <text x="384" y="475" class="mono row r19"><tspan fill="#67e8f9">ShucheeraPrasad</tspan><tspan fill="#9ca3af">().</tspan><tspan fill="#4ade80">transmit</tspan><tspan fill="#9ca3af">()</tspan><tspan class="cursor" fill="#ec4899">▋</tspan></text>

</g>

<!-- Outer border on top -->
<rect width="900" height="510" fill="none" stroke="#4c1d95" stroke-width="1.5" rx="16" opacity="0.6"/>
</svg>
