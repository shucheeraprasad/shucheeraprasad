<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#13001f"/>
    <stop offset="100%" stop-color="#0a0014"/>
  </linearGradient>
  <linearGradient id="topbar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#1a0030"/>
    <stop offset="100%" stop-color="#150025"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#a855f7"/>
    <stop offset="60%"  stop-color="#ec4899"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="headgrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="55%"  stop-color="#e9d5ff"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Nebula blobs -->
  <radialGradient id="nb1" cx="10%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nb2" cx="90%" cy="30%" r="35%">
    <stop offset="0%" stop-color="#be185d" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Main background -->
<rect width="900" height="300" fill="url(#bg)" rx="16"/>

<!-- Nebula ambience -->
<rect width="900" height="300" fill="url(#nb1)" rx="16"/>
<rect width="900" height="300" fill="url(#nb2)" rx="16"/>

<!-- Top bar -->
<rect width="900" height="42" fill="url(#topbar)" rx="16"/>
<rect x="0" y="26" width="900" height="16" fill="url(#topbar)"/>
<line x1="0" y1="42" x2="900" y2="42" stroke="#2e0050" stroke-width="1"/>

<!-- Dot icons -->
<circle cx="22" cy="21" r="6" fill="#3b0764" stroke="#6d28d9" stroke-width="1"/>
<circle cx="42" cy="21" r="6" fill="#3b0764" stroke="#6d28d9" stroke-width="1"/>
<circle cx="62" cy="21" r="6" fill="#3b0764" stroke="#6d28d9" stroke-width="1"/>

<!-- readme path label -->
<text x="86" y="26" font-family="'SF Mono',Consolas,monospace" font-size="12" fill="#6b21a8">shucheeraprasad</text>
<text x="228" y="26" font-family="'SF Mono',Consolas,monospace" font-size="12" fill="#4b5563"> / </text>
<text x="248" y="26" font-family="'SF Mono',Consolas,monospace" font-size="12" fill="#a855f7">README.md</text>

<!-- Stars scattered -->
<circle cx="550" cy="90"  r="1.2" fill="#fff" opacity="0.6"/>
<circle cx="620" cy="60"  r="0.8" fill="#fff" opacity="0.4"/>
<circle cx="700" cy="130" r="1.5" fill="#fff" opacity="0.5"/>
<circle cx="750" cy="80"  r="0.9" fill="#fff" opacity="0.7"/>
<circle cx="800" cy="180" r="1.1" fill="#fff" opacity="0.4"/>
<circle cx="840" cy="100" r="0.7" fill="#fff" opacity="0.6"/>
<circle cx="870" cy="240" r="1.3" fill="#c084fc" opacity="0.5"/>
<circle cx="820" cy="260" r="0.8" fill="#f472b6" opacity="0.5"/>
<circle cx="880" cy="60"  r="1.0" fill="#fff" opacity="0.5"/>
<circle cx="660" cy="200" r="0.9" fill="#fff" opacity="0.3"/>
<circle cx="580" cy="240" r="1.4" fill="#c084fc" opacity="0.4"/>

<!-- Left accent bar -->
<rect x="30" y="62" width="3" height="210" rx="2" fill="url(#accent)" opacity="0.8"/>

<!-- Big heading -->
<text x="52" y="120" font-family="Georgia,serif" font-size="52" font-weight="700" fill="url(#headgrad)" filter="url(#softglow)">Signal Received.</text>

<!-- Subheading -->
<text x="52" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#c084fc" letter-spacing="2">🔭  FOREST ASTRONOMER  ·  WIDE-FIELD IMAGER  ·  MESSIER HUNTER</text>

<!-- Divider -->
<line x1="52" y1="162" x2="500" y2="162" stroke="#3b0764" stroke-width="1" opacity="0.7"/>

<!-- Bio lines -->
<text x="52" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" fill="#d8b4fe">
  I'm <tspan fill="#ffffff" font-weight="600">Shucheera Prasad</tspan> — living somewhere between the pine trees and the Pleiades.
</text>
<text x="52" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14.5" fill="#d8b4fe">
  By day I write code; by night I point a telescope at things older than the Sun.
</text>

<!-- Info pills -->
<rect x="52"  y="224" width="220" height="28" rx="14" fill="#1a0030" stroke="#6d28d9" stroke-width="1"/>
<text x="68"  y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#c084fc">🌌  Building a Wide-Field Imager</text>

<rect x="284" y="224" width="190" height="28" rx="14" fill="#1a0030" stroke="#6d28d9" stroke-width="1"/>
<text x="300" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#c084fc">🎯  Full Messier Catalogue</text>

<rect x="486" y="224" width="200" height="28" rx="14" fill="#1a0030" stroke="#6d28d9" stroke-width="1"/>
<text x="502" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#c084fc">🌲  Forest → Telescope → Code</text>

<!-- Bottom border glow -->
<rect x="0" y="298" width="900" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

<!-- Border -->
<rect width="900" height="300" fill="none" stroke="#3b0764" stroke-width="1.5" rx="16" opacity="0.6"/>
</svg>
